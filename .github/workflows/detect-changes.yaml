name: Detect Changes in Terraform Files
on:
  workflow_call:
    inputs:
      terraform_files_pattern:
        required: false
        description: Path to the terraform files to check for changes
        type: string
        default: 'envs/**/*.tf'
    outputs:
      matrix:
        description: JSON array of changed directories for use in a matrix strategy
        value: ${{ jobs.detect-changes.outputs.matrix }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.changed.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        id: changed
        with:
          files: ${{ inputs.terraform_files_pattern }}
          dir_names: "true"
          matrix: "true"
