## This file is auto generated by tfskel: https://github.com/ishuar/tfskel
## This workflow runs Terraform plan & apply for all changed root modules under envs/dev.
##
## - On pull_request : plans only and posts output as a PR comment. set auto_apply to true to enable auto-apply on PRs.
## - On push to main : plans and *always* automatically applies changes.
## - On workflow_dispatch : manually trigger with optional auto_apply.
##
## Delegates all logic to reusable-terraform-plan-apply.yaml.
## Expects an AWS OIDC role and a GitHub environment 'dev' with appropriate protection rules.

name: "Dev: TF plan & apply"
on:
  pull_request:
    branches:
      - main
    paths:
      - 'envs/dev/**'
      - '.github/workflows/terraform-plan-apply.yaml'

  push:
    branches:
      - main
    paths:
      - 'envs/dev/**'
      - '.github/workflows/terraform-plan-apply.yaml'

  ## For manual trigger on github UI
  workflow_dispatch:
    inputs:
      auto_apply:
        type: boolean
        required: false
        default: false
        description: Set to true to auto-apply terraform plan. Keep false for production unless using approval gates.
      tfskel_version:
        type: string
        required: false
        default: 'latest'
        description: The version of tfskel to use for plan analysis.

jobs:
  detect:
    uses: ./.github/workflows/detect-changes.yaml
    with:
      terraform_files_pattern: 'envs/dev/**/*.tf'

  terraform-plan-apply:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/reusable-terraform-plan-apply.yaml
    permissions:
      pull-requests: write
      contents: read
      id-token: write
    with:
      terraform_files_path: ${{ matrix.path }}
      aws_region: ${{ matrix.region }}
      aws_role_to_assume: "arn:aws:iam::484941465042:role/tfskel-terraform-${{ matrix.environment }}-admin-github-oidc-role"
      environment: ${{ matrix.environment }}
      auto_apply: ${{ inputs.auto_apply || false }}
      tfskel_version: ${{ inputs.tfskel_version || 'latest' }}
