on:
  pull_request:
    paths: ['envs/**']

jobs:
  detect:
    uses: ./.github/workflows/detect-changes.yaml

  lint:
    needs: detect
    permissions:
      pull-requests: write
      contents: read
    if: needs.detect.outputs.matrix != '[]'
    strategy:
      matrix:
        path: ${{ fromJson(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/reusable-lint.yaml
    with:
      terraform_files_path: ${{ matrix.path }}
